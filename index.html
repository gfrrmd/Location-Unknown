<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Location Unknown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --body:  #0e1012;
      --dev:   #1a1d22;
      --edge:  #11131a;
      --bezel: #20232a;
      --scr:   #071209;
      --g:     #3dff8f;
      --gdim:  #173d22;
      --red:   #ff4a4a;
      --mono:  'Share Tech Mono', monospace;
      --orb:   'Orbitron', sans-serif;
    }

    html { height: 100%; }

    body {
      min-height: 100svh;
      background: var(--body);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      padding: 20px 12px;
    }

    .device {
      width: min(390px, 94vw);
      background: var(--dev);
      border-radius: 24px 24px 44px 44px;
      border: 2px solid #2a2e38;
      box-shadow: 0 0 0 1px #09090b, 0 12px 60px rgba(0,0,0,.9),
                  inset 0 1px 0 rgba(255,255,255,.05);
      overflow: hidden;
    }

    .device-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px 8px;
      background: var(--edge);
      border-bottom: 1px solid #0c0e12;
    }

    .led {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--g);
      box-shadow: 0 0 8px 3px rgba(61,255,143,.5);
      animation: ledpulse 2s ease-in-out infinite;
    }

    .device-brand {
      font-family: var(--orb);
      font-size: 11px;
      letter-spacing: .22em;
      color: #3a4050;
    }

    .speaker-holes { display: flex; gap: 5px; }
    .speaker-holes span {
      display: block;
      width: 3px; height: 12px; border-radius: 2px;
      background: #1e2228;
      box-shadow: inset 0 1px 1px rgba(0,0,0,.7);
    }

    .bezel {
      padding: 12px 14px 10px;
      background: var(--bezel);
    }

    .screen {
      background: var(--scr);
      border-radius: 6px;
      border: 2px solid #0b1e0e;
      box-shadow: inset 0 0 28px rgba(0,0,0,.7),
                  0 0 16px rgba(61,255,143,.06);
      padding: 10px 11px 11px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      position: relative;
      overflow: hidden;
    }

    .screen::after {
      content: '';
      position: absolute; inset: 0;
      pointer-events: none; z-index: 10;
      background: repeating-linear-gradient(
        0deg, transparent 0, transparent 3px,
        rgba(0,0,0,.15) 3px, rgba(0,0,0,.15) 4px
      );
    }

    .scr-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: var(--g);
      letter-spacing: .1em;
      padding-bottom: 7px;
      border-bottom: 1px solid var(--gdim);
    }

    #coord { color: #2a8a50; font-size: 8.5px; }

    .radar-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    #radar {
      display: block;
      width: 100%;
      max-width: 190px;
      height: auto;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid var(--gdim);
    }

    .radar-label {
      font-size: 9px;
      letter-spacing: .2em;
      color: var(--red);
      animation: blink 1.1s step-start infinite;
    }

    .quote-area {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      border-top: 1px solid var(--gdim);
      padding-top: 8px;
      min-height: 68px;
    }

    .cur {
      color: var(--g);
      font-size: 15px;
      line-height: 1.5;
      animation: blink .75s step-start infinite;
      flex-shrink: 0;
    }

    #quote {
      font-size: 12px;
      color: var(--g);
      line-height: 1.65;
      letter-spacing: .03em;
      opacity: 0;
      transition: opacity .55s;
    }
    #quote.show { opacity: 1; }

    .scr-footer {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: var(--gdim);
      letter-spacing: .1em;
      border-top: 1px solid var(--gdim);
      padding-top: 6px;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 12px;
      background: var(--dev);
      border-top: 1px solid #161920;
    }

    .dpad { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .dp-row { display: flex; justify-content: center; }
    .dp-mid { gap: 2px; align-items: center; }

    .dp {
      width: 30px; height: 30px;
      background: #13151b; border: 1px solid #252932;
      color: #3a4050; font-size: 9px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; border-radius: 4px; padding: 0;
      transition: background .1s;
    }
    .dp:active { background: var(--gdim); color: var(--g); }

    .dp-center {
      width: 30px; height: 30px;
      background: #13151b; border: 1px solid #252932; border-radius: 4px;
    }

    .mid-btns { display: flex; flex-direction: column; align-items: center; gap: 9px; }

    .btn-sm {
      background: #13151b; border: 1px solid #252932;
      color: #353a48; font-family: var(--mono); font-size: 7px;
      letter-spacing: .1em; padding: 4px 9px; border-radius: 10px;
      cursor: pointer; transition: all .15s;
    }
    .btn-sm:active {
      background: var(--gdim); color: var(--g);
      border-color: var(--g); box-shadow: 0 0 8px rgba(61,255,143,.25);
    }

    .nub {
      width: 24px; height: 24px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #2a2e38, #13151b);
      border: 1px solid #252932;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.5);
    }

    .abxy { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .ab-row { display: flex; justify-content: center; }
    .ab-mid { gap: 2px; }

    .ab {
      width: 30px; height: 30px; border-radius: 50%;
      background: #13151b; border: 1px solid #252932;
      color: #353a48; font-family: var(--orb); font-size: 9px; font-weight: 600;
      cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s;
    }
    .ab:active {
      background: var(--gdim); color: var(--g);
      border-color: var(--g); box-shadow: 0 0 10px rgba(61,255,143,.3);
    }

    .device-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 16px 12px;
      background: var(--edge);
      border-top: 1px solid #0c0e12;
    }
    .port { font-size: 16px; color: #1a1d24; }
    .btm-text { font-size: 7px; letter-spacing: .1em; color: #252932; font-family: var(--mono); }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes ledpulse {
      0%,100%{opacity:.5; box-shadow:0 0 5px 2px rgba(61,255,143,.28);}
      50%{opacity:1; box-shadow:0 0 11px 4px rgba(61,255,143,.55);}
    }

    @media (max-width: 360px) {
      .device { border-radius: 18px 18px 36px 36px; }
      .dp, .dp-center, .ab { width: 26px; height: 26px; }
      .nub { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>

  <div class="device">

    <div class="device-top">
      <div class="led"></div>
      <span class="device-brand">ALG-01</span>
      <div class="speaker-holes">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="bezel">
      <div class="screen">

        <div class="scr-header">
          <span class="blink">&#9632; SCANNING</span>
          <span id="coord">LAT ---.---- / LNG ---.----</span>
        </div>

        <div class="radar-wrap">
          <canvas id="radar"></canvas>
          <div class="radar-label" id="radarLabel">SIGNAL LOST</div>
        </div>

        <div class="quote-area">
          <span class="cur">&#9612;</span>
          <p id="quote"></p>
        </div>

        <div class="scr-footer">
          <span>LOCATION UNKNOWN</span>
          <span id="clock">00:00:00</span>
        </div>

      </div>
    </div>

    <div class="controls">
      <div class="dpad">
        <div class="dp-row"><button class="dp">&#9650;</button></div>
        <div class="dp-row dp-mid">
          <button class="dp">&#9664;</button>
          <div class="dp-center"></div>
          <button class="dp">&#9654;</button>
        </div>
        <div class="dp-row"><button class="dp">&#9660;</button></div>
      </div>

      <div class="mid-btns">
        <button class="btn-sm">SELECT</button>
        <div class="nub"></div>
        <button class="btn-sm" id="btnStart">START</button>
      </div>

      <div class="abxy">
        <div class="ab-row"><button class="ab" id="btnY">Y</button></div>
        <div class="ab-row ab-mid">
          <button class="ab" id="btnX">X</button>
          <button class="ab" id="btnA">A</button>
        </div>
        <div class="ab-row"><button class="ab" id="btnB">B</button></div>
      </div>
    </div>

    <div class="device-bottom">
      <span class="port">&#9135;</span>
      <span class="btm-text">LOCATION-UNKNOWN &copy; 2026</span>
      <span class="port">&#9135;</span>
    </div>

  </div>

  <audio id="music" src="location-unknown.mp3" loop preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
