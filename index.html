<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Location Unknown</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --body:  #0a0b0d;
      --dev:   #181b20;
      --edge:  #10121a;
      --bezel: #1e2128;
      --scr:   #060f08;
      --g:     #3dff8f;
      --gdim:  #163620;
      --red:   #ff4a4a;
      --mono:  'Share Tech Mono', monospace;
      --orb:   'Orbitron', sans-serif;
      --btn: clamp(38px, 12vw, 52px);
      --gap: clamp(3px, 1vw, 6px);
    }

    html, body { width: 100%; min-height: 100svh; }
    body {
      background: var(--body);
      display: flex; align-items: flex-start; justify-content: center;
      font-family: var(--mono);
      padding: 14px 12px env(safe-area-inset-bottom, 14px);
    }

    /* ============ BOOT SCREEN ============ */
    #bootScreen {
      position: fixed; inset: 0; z-index: 9999;
      background: #060809;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #bootScreen .boot-logo {
      font-family: var(--orb);
      font-size: clamp(22px, 7vw, 36px);
      letter-spacing: .18em;
      color: var(--g);
      text-shadow: 0 0 24px rgba(61,255,143,.5);
    }
    #bootScreen .boot-sub {
      font-size: clamp(9px, 2.8vw, 12px);
      color: #2b8a52;
      letter-spacing: .22em;
    }
    #bootScreen .boot-prompt {
      font-size: clamp(10px, 3vw, 13px);
      color: var(--g);
      letter-spacing: .18em;
      animation: blink 1s step-start infinite;
      margin-top: 12px;
    }
    #bootScreen .boot-hint {
      font-size: clamp(8px, 2.2vw, 10px);
      color: #253530;
      letter-spacing: .12em;
    }
    /* fade out animasi saat boot selesai */
    #bootScreen.hiding {
      animation: bootFade .6s ease forwards;
    }
    @keyframes bootFade {
      0%   { opacity: 1; }
      100% { opacity: 0; pointer-events: none; }
    }

    /* ============ DEVICE ============ */
    .device {
      width: 100%; max-width: 480px;
      background: var(--dev);
      border-radius: 20px; border: 2px solid #272b35;
      box-shadow: 0 0 0 1px #08090b, 0 16px 60px rgba(0,0,0,.95),
                  inset 0 1px 0 rgba(255,255,255,.04);
      overflow: hidden;
      /* mulai tersembunyi, muncul setelah boot */
      opacity: 0;
      transition: opacity .5s .2s;
    }
    .device.on { opacity: 1; }

    /* TOP */
    .device-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 16px 8px;
      background: var(--edge); border-bottom: 1px solid #0b0d11;
    }
    .led {
      width: 9px; height: 9px; border-radius: 50%;
      background: #1a1d22;
      transition: background .4s, box-shadow .4s;
    }
    .led.on {
      background: var(--g);
      box-shadow: 0 0 8px 3px rgba(61,255,143,.5);
      animation: ledpulse 2s ease-in-out infinite;
    }
    .device-brand { font-family: var(--orb); font-size: 11px; letter-spacing: .22em; color: #363c4a; }
    .speaker-holes { display: flex; gap: 4px; align-items: center; }
    .speaker-holes span { display: block; width: 3px; height: 13px; border-radius: 2px; background: #1c2028; }

    /* SCREEN */
    .bezel { padding: 10px 12px 8px; background: var(--bezel); }
    .screen {
      background: var(--scr);
      border-radius: 7px; border: 2px solid #0a1c0d;
      box-shadow: inset 0 0 28px rgba(0,0,0,.8), 0 0 16px rgba(61,255,143,.05);
      padding: 10px 12px 12px;
      display: flex; flex-direction: column; gap: 9px;
      position: relative; overflow: hidden;
    }
    .screen::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 10;
      background: repeating-linear-gradient(0deg, transparent 0, transparent 3px, rgba(0,0,0,.13) 3px, rgba(0,0,0,.13) 4px);
    }
    .scr-header {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 10px; color: var(--g); letter-spacing: .1em;
      padding-bottom: 7px; border-bottom: 1px solid var(--gdim);
    }
    #coord { color: #2b8a52; font-size: 9px; }
    .radar-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    #radar {
      display: block;
      width: min(200px, 55vw); height: min(200px, 55vw);
      border-radius: 50%; border: 1px solid var(--gdim);
    }
    .radar-label { font-size: 9px; letter-spacing: .2em; color: var(--red); animation: blink 1.1s step-start infinite; }
    .quote-area {
      display: flex; align-items: flex-start; gap: 7px;
      border-top: 1px solid var(--gdim); padding-top: 8px; min-height: 64px;
    }
    .cur { color: var(--g); font-size: 15px; line-height: 1.5; animation: blink .75s step-start infinite; flex-shrink: 0; }
    #quote { font-size: 12px; color: var(--g); line-height: 1.7; letter-spacing: .03em; opacity: 0; transition: opacity .55s; }
    #quote.show { opacity: 1; }
    .scr-footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 8px; color: var(--gdim); letter-spacing: .1em;
      border-top: 1px solid var(--gdim); padding-top: 6px;
    }
    #musicStatus { font-size: 8px; color: #3a4050; letter-spacing: .08em; transition: color .3s; }

    /* CONTROLS */
    .controls {
      background: var(--dev); border-top: 1px solid #14171e;
      padding: 14px 12px 12px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .ctrl-row1 { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-row2 { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 5vw, 32px); }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, var(--btn));
      grid-template-rows: repeat(3, var(--btn));
      gap: var(--gap);
    }
    .dp {
      background: #12141b; border: 1px solid #252a35;
      color: #4a5368; font-size: clamp(10px, 3vw, 13px);
      border-radius: 7px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; transition: background .1s, color .1s;
      -webkit-tap-highlight-color: transparent;
    }
    .dp:active { background: var(--gdim); color: var(--g); border-color: var(--g); }
    .dp-up    { grid-column: 2; grid-row: 1; }
    .dp-left  { grid-column: 1; grid-row: 2; }
    .dp-center { grid-column: 2; grid-row: 2; background: #0d0f14; border-radius: 50%; cursor: default; pointer-events: none; }
    .dp-right { grid-column: 3; grid-row: 2; }
    .dp-down  { grid-column: 2; grid-row: 3; }

    .abxy {
      display: grid;
      grid-template-columns: repeat(3, var(--btn));
      grid-template-rows: repeat(3, var(--btn));
      gap: var(--gap);
    }
    .ab {
      background: #12141b; border: 1px solid #252a35;
      color: #454c5e; font-family: var(--orb);
      font-size: clamp(9px, 2.8vw, 12px); font-weight: 600;
      border-radius: 50%; cursor: pointer; padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .12s; -webkit-tap-highlight-color: transparent;
    }
    .ab:active { background: var(--gdim); color: var(--g); border-color: var(--g); box-shadow: 0 0 12px rgba(61,255,143,.3); }
    .ab.y { grid-column: 2; grid-row: 1; }
    .ab.x { grid-column: 1; grid-row: 2; }
    .ab.a { grid-column: 3; grid-row: 2; }
    .ab.b { grid-column: 2; grid-row: 3; }

    .btn-pill {
      background: #12141b; border: 1px solid #252a35;
      color: #454c5e; font-family: var(--mono);
      font-size: clamp(7px, 2.2vw, 9px); letter-spacing: .1em;
      padding: 7px 14px; border-radius: 20px;
      cursor: pointer; min-width: clamp(50px, 14vw, 68px); text-align: center;
      transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .btn-pill:active { background: var(--gdim); color: var(--g); border-color: var(--g); }
    .nub {
      width: clamp(30px, 8.5vw, 38px); height: clamp(30px, 8.5vw, 38px); border-radius: 50%;
      background: radial-gradient(circle at 38% 38%, #282d38, #0f1115);
      border: 1px solid #252a35; box-shadow: inset 0 2px 5px rgba(0,0,0,.6);
    }

    .device-bottom {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 16px 12px;
      background: var(--edge); border-top: 1px solid #0b0d11;
    }
    .port { font-size: 17px; color: #181c22; }
    .btm-text { font-size: 7px; letter-spacing: .1em; color: #22262f; font-family: var(--mono); }

    #toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: var(--gdim); color: var(--g); border: 1px solid var(--g);
      font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
      padding: 8px 18px; border-radius: 20px;
      opacity: 0; transition: opacity .3s;
      pointer-events: none; z-index: 999; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes ledpulse {
      0%,100%{ opacity:.5; box-shadow:0 0 5px 2px rgba(61,255,143,.28); }
      50%{ opacity:1; box-shadow:0 0 12px 4px rgba(61,255,143,.55); }
    }
  </style>
</head>
<body>

  <!-- BOOT SCREEN: tap untuk menyalakan device + musik -->
  <div id="bootScreen">
    <div class="boot-logo">ALG-01</div>
    <div class="boot-sub">LOCATION UNKNOWN DEVICE</div>
    <div class="boot-prompt">[ TAP TO INITIALIZE ]</div>
    <div class="boot-hint">v1.0 &nbsp;&bull;&nbsp; SYSTEM READY</div>
  </div>

  <div class="device" id="device">

    <div class="device-top">
      <div class="led" id="led"></div>
      <span class="device-brand">ALG-01</span>
      <div class="speaker-holes">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="bezel">
      <div class="screen">
        <div class="scr-header">
          <span class="blink">&#9632; SCANNING</span>
          <span id="coord">LAT ---.---- / LNG ---.----</span>
        </div>
        <div class="radar-wrap">
          <canvas id="radar"></canvas>
          <div class="radar-label" id="radarLabel">SIGNAL LOST</div>
        </div>
        <div class="quote-area">
          <span class="cur">&#9612;</span>
          <p id="quote"></p>
        </div>
        <div class="scr-footer">
          <span>LOCATION UNKNOWN</span>
          <span id="musicStatus">&#9834; OFF</span>
          <span id="clock">00:00:00</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="ctrl-row1">
        <div class="dpad">
          <button class="dp dp-up"    id="dpUp">&#9650;</button>
          <button class="dp dp-left"  id="dpLeft">&#9664;</button>
          <div    class="dp dp-center"></div>
          <button class="dp dp-right" id="dpRight">&#9654;</button>
          <button class="dp dp-down"  id="dpDown">&#9660;</button>
        </div>
        <div class="abxy">
          <button class="ab y" id="btnY">Y</button>
          <button class="ab x" id="btnX">X</button>
          <button class="ab a" id="btnA">A</button>
          <button class="ab b" id="btnB">B</button>
        </div>
      </div>
      <div class="ctrl-row2">
        <button class="btn-pill" id="btnSelect">SEL</button>
        <div class="nub"></div>
        <button class="btn-pill" id="btnStart">START</button>
      </div>
    </div>

    <div class="device-bottom">
      <span class="port">&#9135;</span>
      <span class="btm-text">LOCATION-UNKNOWN &copy; 2026</span>
      <span class="port">&#9135;</span>
    </div>

  </div>

  <div id="toast"></div>
  <audio id="music" src="location-unknown.mp3" loop preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
